# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
matt:
  name:              Matt Taylor
  email:             matttaylor@ucsd.edu

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
    
  about:             |
    Hi! I am a second year MS student in the computer science and engineering department at UC San Diego, advised by Professor [Sean Gao](https://scungao.github.io/).
    I am interested in developing deep learning and reinforcement learning methods for science and physical applications. I hope to explore how AI can be used to accelerate scientific discovery.

    My current research focuses on incorporating certificates of stability into learning-based methods for plasma control in nuclear fusion. Previously, I studied aerospace engineering with a minor in computer science at the University of Illinois
    Urbana-Champaign researching under Professor [Huy Tran](https://huytrtran.github.io/).


